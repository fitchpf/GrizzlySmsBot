name: Check Turkish Number

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run bot
        run: python bot.py
        env:
          GRIZZLY_API_KEY: ${{ secrets.GRIZZLY_API_KEY }}
          SERVICE: ${{ secrets.SERVICE }}
          COUNTRY: ${{ secrets.COUNTRY }}
          MAX_PRICE: ${{ secrets.MAX_PRICE }}
          PROVIDER_IDS: ${{ secrets.PROVIDER_IDS }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          THREADS: ${{ secrets.THREADS }}
          MAX_REQUESTS_PER_SECOND: ${{ secrets.MAX_REQUESTS_PER_SECOND }}
          REQUEST_TIMEOUT_SECONDS: ${{ secrets.REQUEST_TIMEOUT_SECONDS }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}

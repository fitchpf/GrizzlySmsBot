name: Check Turkish Number

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Restore used numbers cache
        uses: actions/cache@v4
        id: cache-used-numbers
        with:
          path: used_numbers.json
          key: used-numbers-v7
      
      - name: Seed cache with repo file if cache miss
        if: steps.cache-used-numbers.outputs.cache-hit != 'true'
        run: |
          if [ -f used_numbers.json ]; then
            echo "Using seed file from repository"
          else
            echo '{"numbers": []}' > used_numbers.json
          fi
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run bot
        run: python bot.py
        env:
          GRIZZLY_API_KEY: ${{ secrets.GRIZZLY_API_KEY }}
          SERVICE: ${{ secrets.SERVICE }}
          COUNTRY: ${{ secrets.COUNTRY }}
          MAX_PRICE: ${{ secrets.MAX_PRICE }}
          PROVIDER_IDS: ${{ secrets.PROVIDER_IDS }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          THREADS: ${{ secrets.THREADS }}
          MAX_REQUESTS_PER_SECOND: ${{ secrets.MAX_REQUESTS_PER_SECOND }}
          REQUEST_TIMEOUT_SECONDS: ${{ secrets.REQUEST_TIMEOUT_SECONDS }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
      
      - name: Debug cache contents (after bot run)
        run: |
          if [ -f used_numbers.json ]; then
            echo "Cache file after bot run:"
            cat used_numbers.json
          else
            echo "Cache file not found after bot run"
          fi
      
      - name: Save updated used numbers cache
        uses: actions/cache@v4
        with:
          path: used_numbers.json
          key: used-numbers-v7
      
      - name: Commit updated used numbers to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_numbers.json
          git diff --staged --quiet || git commit -m "Auto-update used_numbers.json [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
